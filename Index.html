<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>What's For Dinner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-2">
        <div class="logo-circle">
          <i class="bi bi-egg-fried"></i>
        </div>
        <div>
          <h1 class="app-title mb-0">What's For Dinner</h1>
          <p class="app-subtitle mb-0">Your daily meal inspiration</p>
        </div>
      </div>
      <div class="d-flex align-items-center gap-3">
        <i class="bi bi-bookmark header-icon"></i>
        <i class="bi bi-clock-history header-icon"></i>
        <i class="bi bi-gear header-icon"></i>
        <img src="./avatar-4.jpg" class="avatar" alt="user avatar" />
      </div>
    </div>
  </header>
  <main class="app-main">
    <div class="container">
      <div class="recipe-card" id="recipeCard">
        <div class="row g-0">
          <div class="col-lg-6 recipe-image-col">
            <div class="recipe-image-wrapper">
              <img id="recipeImage" src="" alt="" class="recipe-image" />
              <div class="rating-badge">
                <i class="bi bi-star-fill"></i>
                <span id="recipeRating"></span>
                <span class="reviews" id="recipeReviews"></span>
              </div>
            </div>
            <div class="stats-bar">
              <div class="stat-item">
                <i class="bi bi-clock-fill stat-icon prep"></i>
                <span class="stat-label">Prep Time</span>
                <span class="stat-value" id="prepTime"></span>
              </div>
              <div class="stat-item">
                <i class="bi bi-fire stat-icon cook"></i>
                <span class="stat-label">Cook Time</span>
                <span class="stat-value" id="cookTime"></span>
              </div>
              <div class="stat-item">
                <i class="bi bi-people-fill stat-icon servings"></i>
                <span class="stat-label">Servings</span>
                <span class="stat-value" id="servings"></span>
              </div>
            </div>
          </div>

          <div class="col-lg-6 recipe-details-col">

            <div class="d-flex justify-content-between align-items-start">
              <div class="badges-row">
                <span class="badge-pill badge-difficulty" id="difficultyBadge"></span>
                <span class="badge-pill badge-cuisine" id="cuisineBadge"></span>
              </div>
              <div class="action-icons">
                <button class="icon-btn" id="saveBtn" title="Save recipe"><i class="bi bi-bookmark-fill"></i></button>
                <button class="icon-btn" id="shareBtn" title="Share recipe"><i class="bi bi-share-fill"></i></button>
              </div>
            </div>

            <h2 class="recipe-name" id="recipeName"></h2>
            <p class="recipe-description" id="recipeDescription"></p>


            <ul class="nav recipe-tabs" id="recipeTabs">
              <li class="nav-item">
                <button class="tab-btn active" data-tab="ingredients">
                  <i class="bi bi-list-check"></i> Ingredients
                </button>
              </li>
              <li class="nav-item">
                <button class="tab-btn" data-tab="instructions">
                  <i class="bi bi-journal-text"></i> Instructions
                </button>
              </li>
              <li class="nav-item">
                <button class="tab-btn" data-tab="nutrition">
                  <i class="bi bi-pie-chart-fill"></i> Nutrition
                </button>
              </li>
              <li class="nav-item">
                <button class="tab-btn" data-tab="tips">
                  <i class="bi bi-lightbulb-fill"></i> Chef's Tips
                </button>
              </li>
            </ul>

            <div class="tab-content-box" id="tabContentBox">
     
            </div>

            <button class="btn-try-another" id="tryAnotherBtn">
              <i class="bi bi-arrow-repeat"></i> Try Another Recipe
            </button>

          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="js/recipes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
